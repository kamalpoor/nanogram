<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clone | NanoGram</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap');
        
        body {
            background-color: #0c1317; /* WhatsApp Dark Background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* WhatsApp Chat Wallpaper Background */
        #messageCanvas {
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay;
            background-color: #0b141a;
        }

        .bubble {
            max-width: 65%;
            padding: 6px 10px 8px 10px;
            margin-bottom: 4px;
            font-size: 14.5px;
            position: relative;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
        }

        /* User Message (Right side) */
        .bubble-out {
            align-self: flex-end;
            background-color: #005c4b;
            color: #e9edef;
            border-radius: 8px 0 8px 8px;
        }

        /* Others Message (Left side) */
        .bubble-in {
            align-self: flex-start;
            background-color: #202c33;
            color: #e9edef;
            border-radius: 0 8px 8px 8px;
        }

        .time-stamp {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            float: right;
            margin-top: 4px;
            margin-left: 8px;
        }

        .sender-name {
            font-size: 12px;
            font-weight: 600;
            color: #ffbc38;
            margin-bottom: 2px;
        }
    </style>
</head>
<body class="p-0 sm:p-4">

    <div class="w-full h-full max-w-[1600px] flex overflow-hidden shadow-2xl bg-[#111b21]">
        <!-- Sidebar (Hidden on small screens) -->
        <div class="hidden md:flex w-[400px] border-r border-white/10 flex-col">
            <header class="h-16 bg-[#202c33] flex items-center px-4 justify-between">
                <div class="w-10 h-10 bg-slate-500 rounded-full"></div>
                <div class="flex gap-6 text-[#aebac1]">
                    <i data-lucide="users-2"></i>
                    <i data-lucide="circle-dashed"></i>
                    <i data-lucide="message-square-plus"></i>
                </div>
            </header>
            <div class="p-3">
                <div class="bg-[#202c33] rounded-lg flex items-center px-4 py-2 gap-4">
                    <i data-lucide="search" class="w-4 h-4 text-[#aebac1]"></i>
                    <input type="text" placeholder="Search or start new chat" class="bg-transparent text-sm outline-none text-white w-full">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto">
                <div class="flex items-center p-3 hover:bg-[#2a3942] cursor-pointer border-b border-white/5">
                    <div class="w-12 h-12 bg-green-600 rounded-full flex items-center justify-center text-xl">🌍</div>
                    <div class="ml-4 flex-1">
                        <div class="flex justify-between"><span class="text-white">Global Lounge</span> <span class="text-xs text-gray-400">1:12 AM</span></div>
                        <p class="text-sm text-gray-400 truncate">Tap to chat with everyone</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col">
            <header class="h-16 bg-[#202c33] flex items-center px-4 justify-between z-10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-green-600 rounded-full flex items-center justify-center">🌍</div>
                    <div>
                        <h3 class="text-white font-semibold">Global Lounge</h3>
                        <p class="text-xs text-green-500">online</p>
                    </div>
                </div>
                <div class="flex gap-5 text-[#aebac1]">
                    <i data-lucide="search" class="w-5 h-5 cursor-pointer"></i>
                    <i data-lucide="more-vertical" class="w-5 h-5 cursor-pointer"></i>
                </div>
            </header>

            <!-- Message Area -->
            <div id="messageCanvas" class="flex-1 overflow-y-auto p-6 flex flex-col"></div>

            <!-- Input Area -->
            <footer class="bg-[#202c33] p-2 flex items-center gap-2">
                <button class="p-2 text-[#aebac1]"><i data-lucide="smile"></i></button>
                <button class="p-2 text-[#aebac1]"><i data-lucide="plus"></i></button>
                <input id="mainInput" type="text" placeholder="Type a message" class="flex-1 bg-[#2a3942] rounded-lg px-4 py-2.5 text-white outline-none text-sm">
                <button id="btnSend" class="p-2 text-[#aebac1]"><i data-lucide="mic"></i></button>
            </footer>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Prompt user for name
        const MY_NAME = prompt("What is your name?") || "Stranger";

        const supabaseUrl = 'https://sengcxnwjmceywsohslq.supabase.co';
        const supabaseKey = 'sb_publishable_2KIjOCaAgLXMkbB2TXlugw_n8ebDMQz';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const msgCanvas = document.getElementById('messageCanvas');
        const mainInput = document.getElementById('mainInput');
        const btnSend = document.getElementById('btnSend');

        function appendMessage(content, sender, type, time = new Date()) {
            const timeStr = new Date(time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const div = document.createElement('div');
            div.className = `bubble ${type === 'out' ? 'bubble-out' : 'bubble-in'}`;
            
            div.innerHTML = `
                ${type === 'in' ? `<div class="sender-name">${sender}</div>` : ''}
                <span>${content}</span>
                <span class="time-stamp">${timeStr} ${type === 'out' ? '✓✓' : ''}</span>
            `;
            
            msgCanvas.appendChild(div);
            msgCanvas.scrollTop = msgCanvas.scrollHeight;
        }

        // Listen for new messages
        _supabase
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                // Agar message doosre ne bheja hai tabhi screen pe dikhao (self-message already handled in handleSend)
                if (payload.new.sender_name !== MY_NAME) {
                    appendMessage(payload.new.content, payload.new.sender_name, 'in', payload.new.created_at);
                }
            })
            .subscribe();

        async function handleSendMessage() {
            const text = mainInput.value.trim();
            if (!text) return;

            appendMessage(text, MY_NAME, 'out');
            mainInput.value = '';

            const { error } = await _supabase
                .from('messages')
                .insert([{ content: text, sender_name: MY_NAME }]);

            if (error) console.error(error);
        }

        btnSend.onclick = handleSendMessage;
        mainInput.onkeydown = (e) => { if (e.key === 'Enter') handleSendMessage(); };

        // Change mic to send icon when typing
        mainInput.oninput = () => {
            const icon = mainInput.value.trim() ? 'send' : 'mic';
            btnSend.innerHTML = `<i data-lucide="${icon}"></i>`;
            lucide.createIcons();
        };
    </script>
</body>
</html>
