<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanogram | Next-Gen Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: radial-gradient(circle, #1a1a2e 0%, #16213e 100%); overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-text { text-shadow: 0 0 10px #4f46e5, 0 0 20px #4f46e5; }
    </style>
</head>
<body class="text-white font-sans h-screen flex items-center justify-center">

    <!-- Main App Container -->
    <div class="w-full max-w-4xl h-[90vh] glass rounded-3xl flex overflow-hidden shadow-2xl">
        
        <!-- Sidebar (Contacts) -->
        <div class="w-1/3 border-r border-white/10 p-6 flex flex-col">
            <h1 class="text-3xl font-black neon-text mb-8 italic">NANOGRAM</h1>
            <div class="space-y-4">
                <div class="p-3 glass rounded-xl flex items-center gap-3 cursor-pointer hover:bg-white/10 transition">
                    <div class="w-10 h-10 bg-indigo-500 rounded-full"></div>
                    <div><p class="font-bold">Global Lounge</p><p class="text-xs text-white/50">Online</p></div>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/5">
                <div><h2 class="text-xl font-bold">Public Room</h2></div>
                <div class="flex gap-4">
                    <button id="callBtn" class="p-2 bg-green-500/20 text-green-400 rounded-full hover:bg-green-500 hover:text-white transition">📞</button>
                    <button class="p-2 bg-indigo-500/20 text-indigo-400 rounded-full hover:bg-indigo-500 hover:text-white transition">📹</button>
                </div>
            </div>

            <!-- Messages Box -->
            <div id="messages" class="flex-1 p-6 overflow-y-auto space-y-4 flex flex-col">
                <!-- Messages will appear here -->
            </div>

            <!-- Input Area -->
            <div class="p-6 bg-white/5 flex gap-4">
                <input id="msgInput" type="text" placeholder="Type a message..." class="flex-1 bg-white/10 border-none rounded-2xl px-6 py-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                <button id="sendBtn" class="bg-indigo-600 px-8 py-3 rounded-2xl font-bold hover:bg-indigo-500 shadow-lg shadow-indigo-500/30 transition">Send</button>
            </div>
        </div>
    </div>

    <!-- Video Modal (Hidden by default) -->
    <div id="videoArea" class="hidden fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50">
        <video id="remoteVideo" autoplay class="w-3/4 rounded-3xl border-2 border-indigo-500"></video>
        <video id="localVideo" autoplay muted class="w-48 absolute bottom-10 right-10 rounded-2xl border-2 border-white"></video>
        <button id="hangup" class="mt-10 bg-red-600 px-10 py-4 rounded-full font-bold">End Call</button>
    </div>

    <script>
        // Supabase Connectivity (Add your keys here)
        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // UI Logic
        const sendBtn = document.getElementById('sendBtn');
        const msgInput = document.getElementById('msgInput');
        const msgBox = document.getElementById('messages');

        // Function to show message
        function appendMessage(text, isMe) {
            const div = document.createElement('div');
            div.className = `max-w-[70%] p-4 rounded-2xl ${isMe ? 'bg-indigo-600 self-end rounded-tr-none' : 'bg-white/10 self-start rounded-tl-none'}`;
            div.innerText = text;
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        sendBtn.onclick = async () => {
            const text = msgInput.value;
            if(!text) return;
            appendMessage(text, true);
            msgInput.value = '';
            // Yahan Supabase insert logic aayega
            await _supabase.from('messages').insert([{ content: text, sender_id: 'User1' }]);
        };
    </script>
</body>
</html>
